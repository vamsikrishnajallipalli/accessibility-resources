<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>குமரி — தமிழ் கேட்புப் முன்னோட்டம்</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans Tamil","Nirmala UI",sans-serif;color-scheme:dark;background:#0b0b0c;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0c;color:#fff}main{max-width:680px;margin:auto;padding:24px 18px 48px}h1{font-size:2rem;line-height:1.2;margin:.25rem 0 .6rem}.by{color:#c8c8cc;margin:0 0 1.5rem}.card{border:1px solid #3b3b40;border-radius:18px;padding:18px;margin:14px 0;background:#171719}.card h2{font-size:1.25rem;margin:0 0 12px}.hint{color:#bbb;font-size:.95rem;line-height:1.45}button{width:100%;min-height:64px;margin:7px 0;border:0;border-radius:14px;font-size:1.13rem;font-weight:750;padding:14px 16px;background:#fff;color:#111;cursor:pointer}button.secondary{background:#303035;color:#fff;border:1px solid #555}button:focus-visible{outline:4px solid #ffd54a;outline-offset:3px}.status{min-height:2.2em;padding:9px 2px;color:#ffd86b;font-weight:650}label{display:block;margin:12px 0 5px}select{width:100%;min-height:50px;border-radius:10px;border:1px solid #666;background:#242428;color:#fff;padding:8px;font-size:1rem}footer{margin-top:24px;color:#a8a8ad;font-size:.85rem;line-height:1.45}</style></head><body><main><p class="hint">லோகேஷ் கேட்பதற்கான எளிய முன்னோட்டம்</p><h1>குமரி</h1><p class="by">வ. கீரா · தமிழ் குரல் சோதனை</p><section class="card"><h2>1. கதை சொல்லும் பகுதி</h2><button type="button" onclick="playSample('narration')">▶ கேட்க</button></section><section class="card"><h2>2. உரையாடல் பகுதி</h2><button type="button" onclick="playSample('dialogue')">▶ கேட்க</button></section><section class="card"><h2>கட்டுப்பாடுகள்</h2><button class="secondary" type="button" onclick="togglePause()">⏯ இடைநிறுத்து / தொடரு</button><button class="secondary" type="button" onclick="stopSpeech()">■ நிறுத்து</button><label for="rate">வேகம்</label><select id="rate"><option value="0.85">மெதுவாக</option><option value="0.95" selected>இயல்பு</option><option value="1.05">சற்று வேகமாக</option><option value="1.15">வேகமாக</option></select><label for="voice">தமிழ் குரல்</label><select id="voice"><option>தமிழ் குரலைத் தேடுகிறது…</option></select><div id="status" class="status" role="status" aria-live="polite">கேட்க தயாராக உள்ளது.</div></section><footer>இது முழு ஆடியோபுக் அல்ல. இயல்பான தமிழ் குரல் மற்றும் உச்சரிப்பைப் பற்றி உடனடி கருத்து பெறும் குறுகிய முன்னோட்டம் மட்டும்.</footer></main><script>const samples={narration:`தன்னால் அது முடியுமா என யோசித்துப் பார்த்தாள் இருவாஞ்சி. மிகவும் கடினமான, செய்து முடிக்கவே முடியாத உச்சம் என்று உணர்ந்திருந்தாள். ஆனால், வேறு வழியே இல்லை. செம்பனின் ஒற்றைப் பார்வைக்கு முன் உயிர் துச்சமென முடிவெடுத்திருந்தாள். தகதகவென மிளிர்ந்து, கடுகளவில் திரண்டிருக்கும் ஒளிப் புள்ளியை ஆசன வாயின் மேல்புறத்தில் உணர்ந்து மனதை இறுக்கிப் பிணைந்தாள். மனமும் ஒளியும் ஒருசேர தண்டுவடத்தில் தீற்றல்களாக ஒளி குமிழ்ந்து உருண்டு மேல் நோக்கி நகர்ந்தது. முதுவெளித் தாய் கொற்றவையை முன்நிறுத்தி, வழி வேண்டும் என்று அவள் வேண்டி நின்றாள்.`,dialogue:`இருவாஞ்சி... ம்... என் யாழிக்கு நரம்பு வேண்டும். யாழிக்கு யாளியின் நரம்பு வேண்டுமா? ம். நீயே கொன்று வா. நீ கொண்டு வா. எது வேண்டும்? சிம்மம். நீ ஏன் கவலைப்படுற வாஞ்சி? சிம்மத்தைக் கொல்லக் காட்டில் அனைத்துரிமையும் உண்டு. ஏய்... அது தெரியாதா? நரம்பக் கேட்கிறாயே! உன் எண்ணத்தச் சொல்லு. என் செம்பனுக்காகவும், என் காதலுக்காகவும், என் கனவுக்காகவும் சிம்மத்தைத் தேடிப் போக இருக்கேன். சிம்மம் உயிரோடு நம்மோடு இருக்க வேண்டும். என் மேல நம்பிக்கையில்லையா செம்பா?`};let voices=[];const voiceSelect=document.getElementById('voice'),statusEl=document.getElementById('status');function tamilVoices(){const all=speechSynthesis.getVoices();const ta=all.filter(v=>/^ta([-_]|$)/i.test(v.lang)||/Tamil|தமிழ்/i.test(v.name));return ta.length?ta:all.filter(v=>/^en-IN/i.test(v.lang))}function loadVoices(){voices=tamilVoices();voiceSelect.innerHTML='';if(!voices.length){const o=document.createElement('option');o.textContent='தமிழ் குரல் கிடைக்கவில்லை';voiceSelect.appendChild(o);return}voices.forEach((v,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=`${v.name} — ${v.lang}`;voiceSelect.appendChild(o)});const preferred=voices.findIndex(v=>/Google|Tamil|தமிழ்/i.test(v.name)&&/^ta/i.test(v.lang));if(preferred>=0)voiceSelect.value=String(preferred)}loadVoices();speechSynthesis.onvoiceschanged=loadVoices;function stopSpeech(){speechSynthesis.cancel();statusEl.textContent='நிறுத்தப்பட்டது.'}function togglePause(){if(speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();statusEl.textContent='இடைநிறுத்தப்பட்டது.'}else if(speechSynthesis.paused){speechSynthesis.resume();statusEl.textContent='தொடர்கிறது.'}}function playSample(key){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(samples[key]);u.lang='ta-IN';u.rate=parseFloat(document.getElementById('rate').value||'0.95');const idx=parseInt(voiceSelect.value,10);if(Number.isFinite(idx)&&voices[idx])u.voice=voices[idx];u.onstart=()=>statusEl.textContent='கேட்கிறது…';u.onend=()=>statusEl.textContent='முடிந்தது.';u.onerror=()=>statusEl.textContent='இந்த உலாவியில் தமிழ் குரல் இயங்கவில்லை.';speechSynthesis.speak(u)}</script></body></html>
